<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Primary Meta Tags (SEO) - per Google SEO Starter Guide -->
    <title>What Does the Internet Know About Me? Free Browser Check</title>
    <meta name="description" content="Live test, not an article. See what a website can learn from one visit: where you are, your device, and a nickname that can follow you. Free. We don't keep your report." />
    <link rel="canonical" href="https://whatdotheyknow.app/" />

    <!-- Robots: allow indexing -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="What Do They Know" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://whatdotheyknow.app/" />
    <meta property="og:title" content="What Does the Internet Know About Me? Free Browser Check" />
    <meta property="og:description" content="Live test, not an article. See what a website can learn from one visit: where you are, your device, and a nickname that can follow you. Free. We don't keep your report." />
    <meta property="og:image" content="https://whatdotheyknow.app/og-image.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="What Do They Know?" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="What Does the Internet Know About Me? Free Browser Check" />
    <meta name="twitter:description" content="Live test, not an article. See what a website can learn from one visit: where you are, your device, and a nickname that can follow you. Free. We don't keep your report." />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Structured Data (JSON-LD) for rich results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "What Do They Know?",
          "alternateName": "What Does the Internet Know About Me",
          "url": "https://whatdotheyknow.app/",
          "description": "Live browser privacy check. See what a website can learn from one visit: where you are, your device, and a nickname that can follow you. We don't keep your report.",
          "applicationCategory": "UtilitiesApplication",
          "operatingSystem": "Any",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "featureList": [
            "Location from your IP",
            "Device nickname (browser fingerprint)",
            "Hidden drawing and silent sound tests",
            "Real IP leak via video calls (WebRTC)",
            "Fonts, hardware, and extra Chrome details"
          ]
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What does the internet know about me?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Any website you visit can see roughly where you are (from your IP address) and a nickname built from how your computer looks online: screen, fonts, graphics chip, timezone, language, and more. You are not asked for permission. This page runs those same checks in your browser and shows the result. We don't keep a copy of the report. Your browser may remember this nickname and your light/dark choice on this device; you can clear that here."
              }
            },
            {
              "@type": "Question",
              "name": "What information does my browser reveal to websites?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Your internet address and provider, a stable nickname for this browser, hidden drawing and silent-sound tests, your graphics card model, a sample of installed fonts, processor cores and memory, screen size, timezone, language, extra Chrome details (exact Windows/macOS version), whether cookies work, and whether a video-call feature can reveal your real IP even on a VPN."
              }
            },
            {
              "@type": "Question",
              "name": "What does every website know about you?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A typical site you have never logged into can see your internet provider, rough location, what kind of device you have, and enough clues to recognize you next time without cookies. It cannot see your name, email, or files unless you type them. The report above is that just-visiting data."
              }
            },
            {
              "@type": "Question",
              "name": "How much does the internet know about me?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "This page counts how many tracking methods work in your browser. It is not a score of how unique you are. For that, you need a crowd to compare against: use EFF's Cover Your Tracks."
              }
            },
            {
              "@type": "Question",
              "name": "Can I stop websites from fingerprinting me?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Two things work: look like everyone else (Tor Browser) or look different every time (Brave slightly randomizes drawings, sound, and graphics per site). An ad blocker such as uBlock Origin, or Firefox's tracking protection, stops most companies from collecting the nickname. Deleting cookies does not change it."
              }
            }
          ]
        }
      ]
    }
    </script>

    <!-- Critical CSS inline to avoid blocking LCP (fonts removed; use system stack) -->
    <style>
      :root{--bg-p:#fff;--bg-s:#f8fafc;--text-p:#0f172a;--text-s:#334155;--border:#e2e8f0;--accent:#4f46e5}
      [data-theme=dark]{--bg-p:#0f172a;--bg-s:#1e293b;--text-p:#f1f5f9;--text-s:#cbd5e1;--border:#334155}
      *{margin:0;padding:0;box-sizing:border-box}
      body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-p);color:var(--text-p);line-height:1.6;min-height:100vh}
      #root{min-height:100vh;display:flex;flex-direction:column}
      .container{max-width:1200px;margin:0 auto;padding:0 1rem;width:100%}
      .header{background:var(--bg-p);border-bottom:1px solid var(--border);padding:1rem 0;position:sticky;top:0;z-index:100}
      .header-content,.hero{display:flex}.header-content{justify-content:space-between;align-items:center;gap:1rem}
      .hero{flex-direction:column;text-align:center;padding:3rem 0 2rem;background:linear-gradient(180deg,var(--bg-s) 0%,var(--bg-p) 100%)}
      .hero h1{font-size:clamp(1.75rem,5vw,2.5rem);font-weight:700;margin-bottom:1rem}
      .hero p{color:var(--text-s);font-size:1.125rem;max-width:600px;margin:0 auto 1.5rem}
      .loading{display:flex;align-items:center;gap:.5rem;color:var(--text-s)}
      .spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.spinner{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>What Do They Know? is a free live privacy check. Enable JavaScript to see what a website can learn from one visit: where you are, your device, and a nickname that can follow you. We don't keep your report.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
