<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Primary Meta Tags (SEO) - per Google SEO Starter Guide -->
    <title>What Does the Internet Know About Me? Free Browser Check</title>
    <meta name="description" content="Live test — not an article. See what your browser reveals to every website: IP, fingerprint, WebRTC, fonts, hardware. Free. Nothing stored or logged." />
    <link rel="canonical" href="https://whatdotheyknow.app/" />

    <!-- Robots: allow indexing -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="What Do They Know" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://whatdotheyknow.app/" />
    <meta property="og:title" content="What Does the Internet Know About Me? Free Browser Check" />
    <meta property="og:description" content="Live test — not an article. See what your browser reveals to every website: IP, fingerprint, WebRTC, fonts, hardware. Free. Nothing stored or logged." />
    <meta property="og:image" content="https://whatdotheyknow.app/og-image.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="What Do They Know?" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="What Does the Internet Know About Me? Free Browser Check" />
    <meta name="twitter:description" content="Live test — not an article. See what your browser reveals to every website: IP, fingerprint, WebRTC, fonts, hardware. Free. Nothing stored or logged." />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Structured Data (JSON-LD) for rich results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "What Do They Know?",
          "alternateName": "What Does the Internet Know About Me",
          "url": "https://whatdotheyknow.app/",
          "description": "Live browser privacy check. See what your browser reveals to every website: IP, fingerprint, WebRTC leaks, canvas, fonts, hardware, and more. Nothing is stored or logged.",
          "applicationCategory": "UtilitiesApplication",
          "operatingSystem": "Any",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "featureList": [
            "IP address and geolocation",
            "Browser fingerprint",
            "Canvas and audio fingerprint",
            "WebRTC leak test",
            "Font, hardware, and client-hint detection"
          ]
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What does the internet know about me?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Any website you visit can read your IP address and approximate location, plus a browser fingerprint built from your screen, fonts, GPU, audio stack, language, timezone, and other properties your browser exposes with no permission prompt. This page runs those same checks in your browser and shows the result. Nothing is stored or logged here."
              }
            },
            {
              "@type": "Question",
              "name": "What information does my browser reveal to websites?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Your browser reveals IP and ISP, a stable fingerprint hash, canvas and audio rendering hashes, WebGL GPU model, installed fonts, CPU cores and RAM, screen size, timezone, language, client hints (exact OS build on Chrome), cookie and storage capability, and whether WebRTC leaks your real public IP."
              }
            },
            {
              "@type": "Question",
              "name": "What does every website know about you?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Every site can see the same first-party signals: who your ISP is, rough location, device class, and enough fingerprint bits to recognize a return visit without cookies. They cannot see your name, email, or files unless you type them. The live report above is the same data a typical site can collect just from a visit."
              }
            },
            {
              "@type": "Question",
              "name": "How much does the internet know about me?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "This tool counts which tracking surfaces work in your browser (IP, fingerprint, canvas, audio, GPU, fonts, hardware, client hints, WebRTC, opt-out signals). That is a count of techniques, not a uniqueness score. For a research-grade estimate against a real population, use EFF's Cover Your Tracks."
              }
            },
            {
              "@type": "Question",
              "name": "Can I stop websites from fingerprinting me?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Two strategies work: blend in (Tor Browser makes users look alike) or add noise (Brave farbling randomizes canvas, audio, and WebGL per site). uBlock Origin and Firefox tracking protection cut off most parties doing the fingerprinting. Clearing cookies does not reset a fingerprint."
              }
            }
          ]
        }
      ]
    }
    </script>

    <!-- Critical CSS inline to avoid blocking LCP (fonts removed; use system stack) -->
    <style>
      :root{--bg-p:#fff;--bg-s:#f8fafc;--text-p:#0f172a;--text-s:#334155;--border:#e2e8f0;--accent:#4f46e5}
      [data-theme=dark]{--bg-p:#0f172a;--bg-s:#1e293b;--text-p:#f1f5f9;--text-s:#cbd5e1;--border:#334155}
      *{margin:0;padding:0;box-sizing:border-box}
      body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-p);color:var(--text-p);line-height:1.6;min-height:100vh}
      #root{min-height:100vh;display:flex;flex-direction:column}
      .container{max-width:1200px;margin:0 auto;padding:0 1rem;width:100%}
      .header{background:var(--bg-p);border-bottom:1px solid var(--border);padding:1rem 0;position:sticky;top:0;z-index:100}
      .header-content,.hero{display:flex}.header-content{justify-content:space-between;align-items:center;gap:1rem}
      .hero{flex-direction:column;text-align:center;padding:3rem 0 2rem;background:linear-gradient(180deg,var(--bg-s) 0%,var(--bg-p) 100%)}
      .hero h1{font-size:clamp(1.75rem,5vw,2.5rem);font-weight:700;margin-bottom:1rem}
      .hero p{color:var(--text-s);font-size:1.125rem;max-width:600px;margin:0 auto 1.5rem}
      .loading{display:flex;align-items:center;gap:.5rem;color:var(--text-s)}
      .spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>What Do They Know? is a free live privacy check. Enable JavaScript to see what your browser reveals to every website: IP, fingerprint, WebRTC, fonts, hardware, and more. Nothing is stored or logged.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
